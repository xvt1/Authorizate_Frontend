<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="bg-dots"></div>
  <div class="bg-glow"></div>

  <div class="auth-wrapper">

    <div class="tabs">
      <button class="tab active" id="tab-signin" onclick="switchTab('signin')">SIGN IN</button>
      <button class="tab" id="tab-signup" onclick="switchTab('signup')">SIGN UP</button>
      <button class="tab" id="tab-verify" style="display:none">VERIFY</button>
    </div>

    <div class="card">

      <div class="form-panel active" id="panel-signin">
        <div class="field-group">
          <label class="field-label">USERNAME</label>
          <input type="text" class="field-input" id="si-username" autocomplete="username" />
        </div>
        <div class="field-group">
          <label class="field-label">PASSWORD</label>
          <div class="input-wrapper">
            <input type="password" class="field-input" id="si-password" autocomplete="current-password" />
            <button class="eye-btn" type="button" onclick="togglePassword('si-password', this)" tabindex="-1" aria-label="Показати пароль">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="spacer"></div>
        <button class="submit-btn" onclick="handleSignIn()">SIGN IN</button>
      </div>

      <div class="form-panel" id="panel-signup">
        <div class="field-group">
          <label class="field-label">USERNAME</label>
          <input type="text" class="field-input" id="su-username" autocomplete="username" />
        </div>
        <div class="field-group">
          <label class="field-label">PASSWORD</label>
          <div class="input-wrapper">
            <input type="password" class="field-input" id="su-password" autocomplete="new-password" />
            <button class="eye-btn" type="button" onclick="togglePassword('su-password', this)" tabindex="-1" aria-label="Показати пароль">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">REPEAT PASSWORD</label>
          <div class="input-wrapper">
            <input type="password" class="field-input" id="su-repeat" autocomplete="new-password" />
            <button class="eye-btn" type="button" onclick="togglePassword('su-repeat', this)" tabindex="-1" aria-label="Показати пароль">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">EMAIL ADDRESS</label>
          <input type="email" class="field-input" id="su-email" autocomplete="email" />
        </div>
        <button class="submit-btn" onclick="handleSignUp()">SIGN UP</button>
      </div>

      <div class="form-panel" id="panel-verify">
        <div style="text-align:center; margin-bottom: 8px;">
          <span class="verify-timer" id="verify-timer">60:00</span>
        </div>
        <p class="verify-text">write the code we sent you by email</p>
        <div class="field-group">
          <input type="text" class="field-input" id="verify-code" maxlength="6" />
        </div>
        <button class="submit-btn" onclick="handleVerify()">SIGN UP</button>
        <div style="text-align:right; margin-top: 12px;">
          <button class="resend-btn" onclick="resendCode()">Send again</button>
        </div>
      </div>

    </div>

    <div class="toast" id="toast"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
